# The Weather Feed plugin, as the WebAssembly module Ectomatter runs (core.json
# names it). Built for wasm32-wasip2 by tools/build-plugins.sh, which puts it
# beside core.json as core.wasm. Its own workspace, since it builds only for
# WebAssembly.
[package]
name = "weather-feed-plugin"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# the core protocol's words and its version, shared with Ectomatter
ectomatter-protocol = { path = "../../../crates/ectomatter-protocol" }
ectomatter-weather = { path = "../crates/ectomatter-weather" }
serde_json = "1"
wit-bindgen = "=0.63.0"

[workspace]

[profile.release]
lto = true
strip = true
