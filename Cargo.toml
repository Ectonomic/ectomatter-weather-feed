# This package's own libraries, as one workspace, so each finds the settings
# it shares with the rest of Ectomatter. The module, in module/, is a
# workspace of its own: it builds only for WebAssembly, inside Ectomatter's
# repository (README.md).
[workspace]
resolver = "3"
members = ["crates/ectomatter-weather"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
authors = ["Grant Garrison", "Claude"]
repository = "https://github.com/Ectonomic/Ectomatter"

# One serde_json for every crate: features unify across a build, so a crate
# asking for its own would change how the app reads JSON depending on what
# else is built with it. Objects keep the order they were written in.
[workspace.dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde = { version = "1.0.229", features = ["derive"] }

